<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>NEXUS_OMNI // C2_PLATFORM_CORE_ALPHA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #00ff66; --bg: #050505; }
        body { background: var(--bg); color: var(--neon); font-family: 'Share Tech Mono', monospace; overflow: hidden; height: 100vh; }
        .panel { border: 1px solid #004422; background: rgba(0, 10, 0, 0.95); box-shadow: inset 0 0 10px rgba(0, 255, 102, 0.1); }
        .data-glitch { animation: glitch 0.1s infinite; }
        @keyframes glitch { 0% { transform: translate(1px); opacity: 0.8; } 50% { transform: translate(-1px); } 100% { opacity: 1; } }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #004422; }
    </style>
</head>
<body class="p-2 grid grid-cols-6 grid-rows-6 gap-2">

    <!-- [01] 系統時間與核核心狀態 -->
    <div class="panel col-span-2 row-span-1 p-2 flex items-center justify-between">
        <h1 class="text-sm">CORE_NEXUS_v9.2 [SEC_ROOT]</h1>
        <div id="sys-clock" class="text-xs">00:00:00</div>
    </div>

    <!-- [02] 即時流量監控器 (Network Sniffer) -->
    <div class="panel col-span-4 row-span-1 p-2 overflow-hidden">
        <h2 class="text-[9px] mb-1">PACKET_SNIFFER_STREAM</h2>
        <div id="packet-stream" class="text-[10px] text-green-800 leading-tight"></div>
    </div>

    <!-- [03] 主終端機 (Advanced CLI) -->
    <div class="panel col-span-3 row-span-5 p-3 flex flex-col">
        <h2 class="text-[10px] mb-2 border-b border-green-900 pb-1">KERNEL_COMMAND_INTERFACE</h2>
        <div id="term-out" class="flex-grow bg-black p-3 text-xs overflow-y-auto mb-2 border border-green-900 shadow-inner">
            <div class="text-green-500">>>> Initializing Security Kernel...</div>
            <div class="text-green-500">>>> Database AD26-8b064 ready.</div>
        </div>
        <div class="flex">
            <span class="text-xs p-2 bg-green-900">ROOT@NEXUS:~$</span>
            <input id="term-in" class="flex-grow bg-black p-2 text-xs border border-green-900 outline-none">
        </div>
    </div>

    <!-- [04] Firebase 核心控制台 -->
    <div class="panel col-span-3 row-span-3 p-3 flex flex-col">
        <h2 class="text-[10px] mb-2 border-b border-green-900 pb-1">FIREBASE_RTDB_INJECTOR</h2>
        <div class="grid grid-cols-2 gap-2 mb-2">
            <input id="db-key" class="bg-black p-2 text-[10px] border border-green-800" placeholder="KEY">
            <input id="db-val" class="bg-black p-2 text-[10px] border border-green-800" placeholder="VALUE">
        </div>
        <div class="flex gap-2 mb-2">
            <button onclick="dbWrite()" class="flex-1 py-2 border border-green-600 text-xs hover:bg-green-900">WRITE_SYNC</button>
            <button onclick="dbRead()" class="flex-1 py-2 border border-green-600 text-xs hover:bg-green-900">FETCH_DATA</button>
        </div>
        <div id="db-console" class="flex-grow bg-black p-2 text-[10px] text-green-700 overflow-y-auto"></div>
    </div>

    <!-- [05] 加密攻擊模組 -->
    <div class="panel col-span-3 row-span-2 p-3">
        <h2 class="text-[10px] mb-2 border-b border-green-900 pb-1">CRYPTOGRAPHIC_ASSAULT_ENGINE</h2>
        <div class="flex items-center gap-2">
            <button id="glitch-start" class="px-4 py-2 bg-red-950 border border-red-500 text-red-500 text-xs hover:bg-red-800">LAUNCH_GLITCH</button>
            <div id="crypto-status" class="text-[10px] text-red-500">SYSTEM_IDLE</div>
        </div>
        <div id="glitch-display" class="mt-2 h-16 w-full bg-black border border-green-900 p-2 font-mono text-[8px] break-all"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, get, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        const config = { apiKey: "AIzaSyCoJIzAVmrty3GddH7X5s5gSeYnMuOsGRk", projectId: "ad26-8b064", databaseURL: "https://ad26-8b064-default-rtdb.firebaseio.com" };
        const app = initializeApp(config);
        const db = getDatabase(app);
        
        window.dbWrite = async () => {
            const k = document.getElementById('db-key').value || 'default';
            const v = document.getElementById('db-val').value || 'null';
            await set(ref(db, k), v);
            logDb(`Wrote ${v} to ${k}`);
        };
        
        window.dbRead = async () => {
            const k = document.getElementById('db-key').value || 'default';
            const s = await get(ref(db, k));
            logDb(`Fetched: ${JSON.stringify(s.val())}`);
        };

        const logDb = (m) => { document.getElementById('db-console').innerHTML += `<div>> ${m}</div>`; };
    </script>

    <script>
        // 大量指令與邏輯處理 (模擬 600 行複雜度)
        const term = document.getElementById('term-out');
        const packet = document.getElementById('packet-stream');
        
        // 核心迴圈：模擬複雜網路監控
        setInterval(() => {
            const hex = Math.random().toString(16).substring(2, 14);
            packet.innerHTML = `[${new Date().toLocaleTimeString()}] PKT_TRANSFER: 0x${hex} -> 0x${Math.random().toString(16).substring(2, 6)}<br>` + packet.innerHTML.split('<br>').slice(0, 10).join('<br>');
            document.getElementById('sys-clock').innerText = new Date().toLocaleTimeString();
        }, 300);

        // 指令解析系統
        document.getElementById('term-in').onkeypress = (e) => {
            if(e.key === 'Enter') {
                const cmd = e.target.value.toLowerCase();
                term.innerHTML += `<div class="text-white">root@nexus:~$ ${cmd}</div>`;
                if(cmd === 'help') term.innerHTML += '<div>Available: scan, clear, override, deploy</div>';
                if(cmd === 'scan') term.innerHTML += '<div class="text-yellow-500">Scanning sub-nodes... 4/4 online.</div>';
                e.target.value = '';
                term.scrollTop = term.scrollHeight;
            }
        };

        // 亂碼攻擊特效引擎
        document.getElementById('glitch-start').onclick = () => {
            let count = 0;
            const display = document.getElementById('glitch-display');
            const interval = setInterval(() => {
                display.innerText = Array.from({length: 100}, () => Math.random().toString(36)[2]).join('');
                document.body.classList.add('data-glitch');
                if(count++ > 20) { clearInterval(interval); document.body.classList.remove('data-glitch'); }
            }, 50);
        };
    </script>
</body>
</html>
